<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form-no-js</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="images/favicon.ico">
    </head>
    <body>
        <form action="https://www.httpbin.org/post" method="post" id="contact-form">
            <label for="name">Name<span class="required">*</span></label>
            <input type="text" id="name" name="name" minlength="1" maxlength="75" required>
            <label for="email">Email<span class="required">*</span></label>
            <input type="email" id="email" name="email" minlength="1" maxlength="254" required>
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" minlength="1" maxlength="2000" required></textarea>
            <input name="possible_bot" type="hidden" value="true">
            <button type="submit">Submit!</button>
            <output class="error-message" for="contact-form"></output>
            <output class="info-message" for="contact-form"></output>
        </form>
    </body>
</html>
